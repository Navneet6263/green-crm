# Old domain → new domain. Every page and API call on greencall.online goes to the same path on crm.greencall.in.
# 308 keeps the method, so app and form POSTs still arrive as POSTs.
# Works only while greencall.online is still registered and pointed at this server.

server {
  listen 80;
  listen [::]:80;
  server_name greencall.online www.greencall.online;
  return 308 https://crm.greencall.in$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name greencall.online www.greencall.online;

  # The old domain's existing certificate (check the folder name with: sudo ls /etc/letsencrypt/live/).
  ssl_certificate /etc/letsencrypt/live/greencall.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/greencall.online/privkey.pem;

  return 308 https://crm.greencall.in$request_uri;
}
