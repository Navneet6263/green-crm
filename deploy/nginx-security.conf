# GreenCRM: security settings for the Nginx site in front of the app.
#
# 1. Put the "http" part inside the http { } block of /etc/nginx/nginx.conf (once).
# 2. Put the "server" part inside the server { listen 443 ... } block of the GreenCRM site,
#    and change the upstream ports if yours differ (frontend 3000, backend 5000).
# 3. Test and reload:  sudo nginx -t && sudo systemctl reload nginx
# Nothing here changes how the app works; it only hides details and blocks what must never be served.

# ---------------- http { } ----------------
server_tokens off;                                   # no Nginx version in headers or error pages
limit_req_zone $binary_remote_addr zone=greencrm_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=greencrm_api:10m rate=20r/s;

# ---------------- server { } ----------------
client_max_body_size 20m;                            # documents are at most 15 MB

# Never serve hidden files (.env, .git, .htpasswd ...) or source maps, even by mistake.
location ~ /\.(?!well-known/) { deny all; return 404; }
location ~* \.(map|env|log|sql|bak|old|swp)$ { deny all; return 404; }

# Login, reset and code endpoints: a slow lane against password guessing.
location ~ ^/api/auth/(login|forgot-password|reset-password|register|mobile-otp) {
  limit_req zone=greencrm_login burst=5 nodelay;
  limit_req_status 429;
  proxy_pass http://127.0.0.1:5000;
  include /etc/nginx/greencrm-proxy.conf;
}

# The API: never cached by Nginx or any proxy, so one person's data can never reach another.
location /api/ {
  limit_req zone=greencrm_api burst=60 nodelay;
  limit_req_status 429;
  proxy_no_cache 1;
  proxy_cache_bypass 1;
  proxy_pass http://127.0.0.1:5000;
  include /etc/nginx/greencrm-proxy.conf;
}

# The website (Next.js).
location / {
  proxy_pass http://127.0.0.1:3000;
  include /etc/nginx/greencrm-proxy.conf;
}

# Headers at the edge too (the app also sends them).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;

